name: Editorial Source Scout
on:
  schedule:
    - cron: '15 5 * * *'
    - cron: '15 8 * * *'
    - cron: '15 11 * * *'
    - cron: '15 14 * * *'
    - cron: '15 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: editorial-source-scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scout trusted Bulgarian and EU sources
        run: npm run scout
      - name: Commit source queue only when changed
        shell: bash
        run: |
          if git diff --quiet data/queue/latest.json; then
            echo "No source-queue change."
            exit 0
          fi
          git config user.name "Photovoltaic Bulgaria Source Scout"
          git config user.email "actions@users.noreply.github.com"
          git add data/queue/latest.json
          git commit -m "editorial: refresh sourced topic queue"
          git push
