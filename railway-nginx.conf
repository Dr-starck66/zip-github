server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ASTRA HTTPS GUARD Ω
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($host = "www.freehotels.info") {
        return 301 https://freehotels.info$request_uri;
    }
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Ownership verification page — excluded from indexing.
    location = /verify-f43eb39ad9a9.html {
        access_log off;
        default_type text/html;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><title>Site verification</title></head><body><!-- f43eb39ad9a9b42a02922178d40f6f30 --></body></html>';
    }

    location = /de/leipzig/list.html { return 301 https://freehotels.info/de/leipzig/; }
    location = /de/halle_an_der_saale/8434 { return 301 https://freehotels.info/de/halle-an-der-saale/; }
    location = /de/krakau/18541 { return 301 https://freehotels.info/de/krakau/; }
    location = /de/mykonos/24532 { return 301 https://freehotels.info/de/mykonos/; }
    location = /en/leipzig/329.html { return 301 https://freehotels.info/en/leipzig/; }
    location = /en/napoli/17914 { return 301 https://freehotels.info/en/napoli/; }

    location = /de/berlin/45.html { try_files $uri =404; }
    location = /de/koeln/133.html { try_files $uri =404; }
    location = /de/frankfurt/14.html { try_files $uri =404; }
    location = /en/berlin/45.html { try_files $uri =404; }

    location ~ ^/(de|en)/([a-z0-9_-]+)/(?:list\.html|[0-9]+(?:\.html)?|[0-9]+/index\.html)/?$ {
        if (-f $document_root/$1/$2/index.html) {
            return 301 https://freehotels.info/$1/$2/;
        }
        return 404;
    }

    location ~ ^/(de|en)/([a-z0-9_-]+)/index\.html$ {
        # $request_uri keeps the original client URI across nginx internal index redirects.
        # Redirect only a real client request for index.html, never the internal directory lookup.
        if ($request_uri ~* "/index\\.html(?:\\?|$)") {
            return 301 https://freehotels.info/$1/$2/;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
