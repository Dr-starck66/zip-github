name: ASTRA BetGPT Chat UI Live Ω

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/astra-betgpt-chat-ui-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-chat-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.62.0
          npx playwright install chromium

      - name: Exercise real mobile chat controls
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = await import("playwright");

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            isMobile: true,
            hasTouch: true,
            userAgent: "Mozilla/5.0 (Linux; Android 14; SM-A047F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Mobile Safari/537.36",
          });

          await context.addInitScript(() => {
            localStorage.setItem("betgpt-18", "1");
            localStorage.setItem("betgpt-consent", "essential");
          });

          const page = await context.newPage();
          const consoleLines = [];
          const pageErrors = [];
          page.on("console", (m) => consoleLines.push(`${m.type()}: ${m.text()}`));
          page.on("pageerror", (e) => pageErrors.push(String(e)));

          const response = await page.goto("https://betgpt.live/chat", {
            waitUntil: "domcontentloaded",
            timeout: 60000,
          });
          console.log("NAV_STATUS", response?.status());

          await page.waitForSelector('textarea[aria-label="Ton message à BetGPT"]', { timeout: 15000 });

          const roast = page.getByRole("button", { name: "Sans filtre", exact: true });
          const send = page.getByRole("button", { name: "Envoyer", exact: true });
          const textarea = page.locator('textarea[aria-label="Ton message à BetGPT"]');

          console.log("COUNTS", {
            roast: await roast.count(),
            send: await send.count(),
            textarea: await textarea.count(),
          });

          console.log("ROAST_BEFORE", await roast.getAttribute("aria-pressed"));
          console.log("PAGE_ERRORS_BEFORE", JSON.stringify(pageErrors));
          console.log("CONSOLE_BEFORE", JSON.stringify(consoleLines.slice(-100)));
          const buttonBox = await roast.boundingBox();
          if (buttonBox) {
            const cx = buttonBox.x + buttonBox.width / 2;
            const cy = buttonBox.y + buttonBox.height / 2;
            const hit = await page.evaluate(({cx,cy}) => document.elementsFromPoint(cx,cy).slice(0,8).map((el) => ({
              tag: el.tagName,
              text: (el.textContent || "").trim().slice(0,100),
              cls: String(el.className || "").slice(0,180),
            })), {cx,cy});
            console.log("ROAST_HIT_STACK", JSON.stringify(hit));
          }
          await roast.click({ timeout: 10000 });
          await page.waitForTimeout(300);
          const roastAfter = await roast.getAttribute("aria-pressed");
          console.log("ROAST_AFTER", roastAfter);
          console.log("PAGE_ERRORS_AFTER_CLICK", JSON.stringify(pageErrors));
          console.log("CONSOLE_AFTER_CLICK", JSON.stringify(consoleLines.slice(-100)));
          if (roastAfter !== "true") {
            throw new Error("HYDRATION_OR_INTERACTION_FAIL: Sans filtre did not change state");
          }

          await textarea.fill("La France va perdre 25-0 son prochain match.");
          console.log("TEXTAREA_VALUE", await textarea.inputValue());

          const chatResponsePromise = page.waitForResponse(
            (r) => r.url().includes("/api/chat") && r.request().method() === "POST",
            { timeout: 20000 },
          );
          await send.click({ timeout: 10000 });
          const chatResponse = await chatResponsePromise;
          console.log("CHAT_STATUS", chatResponse.status());

          await page.waitForFunction(
            () => document.body.innerText.includes("tabouret probabiliste") ||
                  document.body.innerText.includes("CALAMAR") ||
                  document.body.innerText.includes("score pareil"),
            null,
            { timeout: 20000 },
          );

          console.log("PAGE_ERRORS", JSON.stringify(pageErrors));
          console.log("CONSOLE", JSON.stringify(consoleLines.slice(-50)));

          if (pageErrors.length) {
            throw new Error("Browser page errors: " + pageErrors.join(" | "));
          }
          if ((await roast.getAttribute("aria-pressed")) !== "true") {
            throw new Error("Sans filtre click did not change aria-pressed");
          }
          if (chatResponse.status() !== 200) {
            throw new Error("Chat POST status " + chatResponse.status());
          }

          console.log("ASTRA_CHAT_UI_LIVE_PASS");

          // Fresh-visitor gate: first visit must be understandable and become fully interactive.
          const fresh = await browser.newContext({
            viewport: { width: 390, height: 844 },
            isMobile: true,
            hasTouch: true,
            userAgent: "Mozilla/5.0 (Linux; Android 14; SM-A047F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Mobile Safari/537.36",
          });
          const freshPage = await fresh.newPage();
          const freshErrors = [];
          freshPage.on("pageerror", (e) => freshErrors.push(String(e)));

          await freshPage.goto("https://betgpt.live/chat", { waitUntil: "domcontentloaded", timeout: 60000 });
          await freshPage.waitForSelector('textarea[aria-label="Ton message à BetGPT"]', { timeout: 15000 });

          const revision = await freshPage.evaluate(async () => {
            const r = await fetch("/astra-revision.json", { cache: "no-store" });
            return await r.json();
          });
          console.log("PUBLIC_REVISION", revision.sourceSha);
          if (revision.sourceSha !== "ae9dd013c72d4b7a7634d748ed968d0b7c948ef8") {
            throw new Error("Unexpected public revision " + revision.sourceSha);
          }

          const ageButton = freshPage.getByRole("button", {
            name: "J’ai 18 ans ou plus — accéder au site",
            exact: true,
          });
          const consentButton = freshPage.getByRole("button", { name: "Essentiels seulement", exact: true });
          const freshRoast = freshPage.getByRole("button", { name: "Sans filtre", exact: true });
          const freshSend = freshPage.getByRole("button", { name: "Envoyer", exact: true });
          const freshTextarea = freshPage.locator('textarea[aria-label="Ton message à BetGPT"]');

          const ageVisibleBefore = await ageButton.isVisible();
          const consentVisibleBefore = await consentButton.isVisible().catch(() => false);
          console.log("FRESH_BEFORE", { ageVisibleBefore, consentVisibleBefore });
          if (!ageVisibleBefore) throw new Error("18+ gate is not visible on first visit");
          if (consentVisibleBefore) throw new Error("cookie consent is stacked under the 18+ gate");

          await ageButton.click({ timeout: 10000 });
          await consentButton.waitFor({ state: "visible", timeout: 10000 });
          console.log("AGE_GATE_ACCEPT_PASS");

          await consentButton.click({ timeout: 10000 });
          await consentButton.waitFor({ state: "hidden", timeout: 10000 });
          console.log("COOKIE_CONSENT_PASS");

          console.log("FRESH_ROAST_BEFORE", await freshRoast.getAttribute("aria-pressed"));
          await freshRoast.click({ timeout: 10000 });
          console.log("FRESH_ROAST_AFTER", await freshRoast.getAttribute("aria-pressed"));
          if ((await freshRoast.getAttribute("aria-pressed")) !== "true") {
            throw new Error("Sans filtre did not activate after legal gates");
          }

          await freshTextarea.fill("La France va perdre 25-0 son prochain match.");
          const freshChatResponsePromise = freshPage.waitForResponse(
            (r) => r.url().includes("/api/chat") && r.request().method() === "POST",
            { timeout: 20000 },
          );
          await freshSend.click({ timeout: 10000 });
          const freshChatResponse = await freshChatResponsePromise;
          console.log("FRESH_CHAT_STATUS", freshChatResponse.status());
          if (freshChatResponse.status() !== 200) {
            throw new Error("Fresh visitor chat POST status " + freshChatResponse.status());
          }

          await freshPage.waitForFunction(
            () => document.body.innerText.includes("CALAMAR") ||
                  document.body.innerText.includes("score pareil"),
            null,
            { timeout: 20000 },
          );
          if (freshErrors.length) throw new Error("Fresh visitor page errors: " + freshErrors.join(" | "));
          console.log("ASTRA_FRESH_VISITOR_CHAT_UI_PASS");

          await fresh.close();
          await browser.close();
          NODE
