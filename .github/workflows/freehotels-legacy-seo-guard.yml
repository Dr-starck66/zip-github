name: FreeHotels Legacy SEO Guard

on:
  push:
    branches: [freehotels-railway-omega]
    paths:
      - 'legacy/**'
      - 'railway-nginx.conf'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Railway deployment and verify
        shell: bash
        run: |
          set -euo pipefail
          base="https://freehotels.info"

          wait_for_200() {
            local path="$1"
            for i in $(seq 1 24); do
              code=$(curl -sS -o /tmp/page -w '%{http_code}' "$base$path" || true)
              if [ "$code" = "200" ]; then return 0; fi
              sleep 15
            done
            echo "Expected 200 for $path, got $code"
            exit 1
          }

          expect_301() {
            local path="$1"
            local expected="$2"
            headers=$(curl -sS -I "$base$path" || true)
            code=$(printf '%s' "$headers" | awk 'NR==1{print $2}')
            location=$(printf '%s' "$headers" | awk 'BEGIN{IGNORECASE=1}/^location:/{gsub("\r","");print $2}' | tail -1)
            test "$code" = "301"
            test "$location" = "$expected"
          }

          for path in             /de/             /de/europa/             /de/leipzig/             /de/dresden/             /de/berlin/guenstige-hotels/             /de/muenchen/flughafen/             /en/             /en/berlin/             /sitemap-legacy.xml
          do
            wait_for_200 "$path"
          done

          expect_301 /de/leipzig/list.html https://freehotels.info/de/leipzig/
          expect_301 /de/halle_an_der_saale/8434 https://freehotels.info/de/halle-an-der-saale/
          expect_301 /en/leipzig/329.html https://freehotels.info/en/leipzig/

          for path in /de/berlin/45.html /de/koeln/133.html /de/frankfurt/14.html /en/berlin/45.html; do
            wait_for_200 "$path"
          done

          unknown=$(curl -sS -o /dev/null -w '%{http_code}' "$base/de/does-not-exist/99999" || true)
          test "$unknown" = "404"

          curl -fsS "$base/de/berlin/guenstige-hotels/" | grep -q '<link rel="canonical" href="https://freehotels.info/de/berlin/guenstige-hotels/">'
          count=$(curl -fsS "$base/sitemap-legacy.xml" | grep -c '<url>')
          test "$count" -ge 70
          curl -fsS "$base/robots.txt" | grep -q 'Sitemap: https://freehotels.info/sitemap.xml'

          wait_for_200 "/268d53f637eeacf2e56853f16afb545a23d04faeffe760cc5c9f73c233822070.txt"
          echo "FreeHotels legacy SEO guard PASS: targets=200, historical redirects=301, preserved legacy pages=200, unknown legacy path=404, sitemap/canonical present."

      - name: Submit rebuilt corpus to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          base="https://freehotels.info"
          key="268d53f637eeacf2e56853f16afb545a23d04faeffe760cc5c9f73c233822070"
          curl -fsS "$base/sitemap-legacy.xml" -o /tmp/sitemap.xml
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          root=ET.parse('/tmp/sitemap.xml').getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[n.text.strip() for n in root.findall('s:url/s:loc',ns) if n.text]
          payload={
            "host":"freehotels.info",
            "key":"268d53f637eeacf2e56853f16afb545a23d04faeffe760cc5c9f73c233822070",
            "keyLocation":"https://freehotels.info/268d53f637eeacf2e56853f16afb545a23d04faeffe760cc5c9f73c233822070.txt",
            "urlList":urls[:10000],
          }
          open('/tmp/indexnow.json','w').write(json.dumps(payload))
          print(f"IndexNow URLs: {len(payload['urlList'])}")
          PY
          code=$(curl -sS -o /tmp/indexnow-response -w '%{http_code}'             -H 'Content-Type: application/json; charset=utf-8'             --data-binary @/tmp/indexnow.json             https://api.indexnow.org/indexnow)
          cat /tmp/indexnow-response || true
          echo "IndexNow HTTP $code"
          test "$code" = "200" -o "$code" = "202"
