name: Build Photovoltaic Bulgaria
on:
  push:
    branches: [main]
    paths:
      - 'photovoltaic-bulgaria-src/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: photovoltaic-bulgaria-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and verify
        working-directory: photovoltaic-bulgaria-src
        run: |
          npm run build
          npm run check
      - name: Refresh public preview
        run: |
          set -euo pipefail
          rm -rf photovoltaic-bulgaria
          cp -a photovoltaic-bulgaria-src/dist photovoltaic-bulgaria
          python - <<'PY'
          from pathlib import Path
          base='/zip-github/photovoltaic-bulgaria'
          for p in Path('photovoltaic-bulgaria').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=s.replace('href="/', f'href="{base}/').replace('src="/', f'src="{base}/')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit only when public build changed
        run: |
          git config user.name 'Photovoltaic Bulgaria Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add photovoltaic-bulgaria
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'site: rebuild Photovoltaic Bulgaria'
          git push
