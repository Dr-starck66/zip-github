name: Photovoltaic Bulgaria Source Scout
on:
  schedule:
    - cron: '15 5 * * *'
    - cron: '15 8 * * *'
    - cron: '15 11 * * *'
    - cron: '15 14 * * *'
    - cron: '15 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: photovoltaic-bulgaria-source-scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan trusted Bulgarian and EU sources
        working-directory: photovoltaic-bulgaria-src
        run: npm run scout
      - name: Commit source queue only when changed
        run: |
          git config user.name 'Photovoltaic Bulgaria Source Scout'
          git config user.email 'actions@users.noreply.github.com'
          git add photovoltaic-bulgaria-src/data/queue/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'editorial: refresh Photovoltaic Bulgaria source queue'
          git push
