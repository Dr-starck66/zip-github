name: ASTRA BetGPT Public Verify Ω

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "betgpt-railway-live/.astra-public-verify-request"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout verification request
        uses: actions/checkout@v4

      - name: Verify public revision, chat and article sidebar imagery
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(jq -r '.target // empty' betgpt-railway-live/.astra-public-verify-request)"
          [[ "$TARGET" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Invalid verification target"; exit 1; }

          echo "== revision =="
          REV="$(curl -fsS --connect-timeout 8 --max-time 25 -H 'cache-control: no-cache' https://betgpt.live/astra-revision.json)"
          echo "$REV"
          PUBLIC_SHA="$(printf '%s' "$REV" | jq -r '.sourceSha // empty')"
          test "$PUBLIC_SHA" = "$TARGET"
          echo "PUBLIC_REVISION_PASS=$PUBLIC_SHA"

          echo "== health =="
          HEALTH="$(curl -sS --connect-timeout 8 --max-time 25 -o /tmp/health -w '%{http_code}' https://betgpt.live/api/health)"
          cat /tmp/health
          echo
          test "$HEALTH" = "200"
          echo "PUBLIC_HEALTH_PASS"

          echo "== France–Italie article sidebar imagery =="
          ARTICLE_URL="https://betgpt.live/actualites/france-italie-ligue-des-nations-2026-10-02"
          ARTICLE_HTML="$(curl --compressed --retry 3 --retry-delay 2 --retry-all-errors -fsSL --connect-timeout 12 --max-time 90 -H 'cache-control: no-cache' "$ARTICLE_URL")"
          echo "PUBLIC_ARTICLE_HTML_BYTES=${#ARTICLE_HTML}"
          for BAD in "libre de droits" "bibliothèque BetGPT" "recadrée" "photo d’illustration" "photo d'illustration" "Elle n’illustre pas" "Elle n'illustre pas"; do
            if printf '%s\n' "$ARTICLE_HTML" | grep -Fqi "$BAD"; then
              echo "PUBLIC_IMAGE_COPY_FAIL forbidden=$BAD"
              exit 1
            fi
          done
          printf '%s\n' "$ARTICLE_HTML" | grep -F "France – Italie en Ligue des nations de l’UEFA : informations, contexte et analyse du match." >/dev/null
          echo "PUBLIC_IMAGE_COPY_PASS=$TARGET"
          printf '%s\n' "$ARTICLE_HTML" | grep -F "À lire aussi" >/dev/null
          printf '%s\n' "$ARTICLE_HTML" | grep -F "France - Italie, Ligue des nations A, match en direct le 02/10/2026" >/dev/null
          printf '%s\n' "$ARTICLE_HTML" | grep -F "/blog/discover/inline-night.jpg" >/dev/null
          printf '%s\n' "$ARTICLE_HTML" | grep -F "Équipe de France : DEMBÉLÉ est-il le LEADER d'attaque ?" >/dev/null
          printf '%s\n' "$ARTICLE_HTML" | grep -F "/blog/discover/inline-live.jpg" >/dev/null
          printf '%s\n' "$ARTICLE_HTML" | grep -F "Azerbaijan – Liechtenstein : 0–0, résultat et faits du match" >/dev/null
          printf '%s\n' "$ARTICLE_HTML" | grep -F "/blog/discover/inline-action.jpg" >/dev/null
          printf '%s\n' "$ARTICLE_HTML" | grep -F 'width="1200"' >/dev/null
          printf '%s\n' "$ARTICLE_HTML" | grep -F 'height="675"' >/dev/null
          printf '%s\n' "$ARTICLE_HTML" | grep -F "max-image-preview:large" >/dev/null
          echo "PUBLIC_ARTICLE_SIDEBAR_IMAGE_PASS=$TARGET"

          echo "== revision-bound viral UX source =="
          PANEL="$(curl -fsSL --connect-timeout 8 --max-time 25 "https://raw.githubusercontent.com/Dr-starck66/betgpt-railway/$TARGET/src/components/chat-panel.tsx")"
          SHARE="$(curl -fsSL --connect-timeout 8 --max-time 25 "https://raw.githubusercontent.com/Dr-starck66/betgpt-railway/$TARGET/src/lib/chat/share.ts")"
          printf '%s\n' "$PANEL" | grep -F "Moment à partager" >/dev/null
          printf '%s\n' "$PANEL" | grep -F "Défie un pote" >/dev/null
          printf '%s\n' "$PANEL" | grep -F "Facebook" >/dev/null
          printf '%s\n' "$PANEL" | grep -F "Instagram / Story" >/dev/null
          printf '%s\n' "$PANEL" | grep -F "🔥 Défi reçu" >/dev/null
          printf '%s\n' "$PANEL" | grep -F "Accepte le défi" >/dev/null
          printf '%s\n' "$PANEL" | grep -F "Sans filtre activé" >/dev/null
          printf '%s\n' "$PANEL" | grep -F 'track("chat_share_offer")' >/dev/null
          printf '%s\n' "$PANEL" | grep -F 'track("chat_challenge_view", shareSource)' >/dev/null
          printf '%s\n' "$PANEL" | grep -F 'track("chat_challenge_accept", shareSource)' >/dev/null
          printf '%s\n' "$SHARE" | grep -F 'share_source' >/dev/null
          printf '%s\n' "$SHARE" | grep -F 'canvas.width = 1080' >/dev/null
          printf '%s\n' "$SHARE" | grep -F 'canvas.height = 1350' >/dev/null
          echo "PUBLIC_VIRAL_UX_SOURCE_PASS=$TARGET"
          echo "PUBLIC_VIRAL_UX_MARKERS=Moment à partager | Défie un pote | X | Facebook | Instagram / Story | Défi reçu | Accepte le défi | Sans filtre activé | challenge view/accept | share_source | 1080x1350"

          echo "== exact absurd-score personality chat =="
          python3 - <<'PY'
          import json,urllib.request

          URL="https://betgpt.live/api/chat"
          memory={
            "sarcasticIntensity":100,
            "blackBook":{
              "combinésDePlus5Matchs":0,
              "jaiUnFeeling":0,
              "parisModifiésDerniereSeconde":0,
              "matchsImpossiblesAPerdre":0,
              "matchsEffectivementPerdus":0,
              "niveauDeConfianceInjustifie":0
            },
            "preferences":{"favoriteTeams":[],"favoriteCompetitions":[]}
          }

          def ask(mode):
            payload=json.dumps({
              "messages":[{"role":"user","content":"La France va perdre 25-0 son prochain match.","timestamp":1}],
              "requestedMode":mode,
              "userMemory":memory
            },ensure_ascii=False).encode()
            req=urllib.request.Request(
              URL,
              data=payload,
              headers={"content-type":"application/json","user-agent":"ASTRA-Public-Verify/2.0"},
              method="POST"
            )
            with urllib.request.urlopen(req,timeout=20) as r:
              assert r.status==200
              return json.load(r)

          normal=ask("NORMAL")
          ntext=str(normal.get("text","")).strip()
          nlow=ntext.lower()
          assert ntext, normal
          assert "secours local" not in nlow, ntext
          assert "tabouret probabiliste" in nlow, ntext
          assert "mathématiques" in nlow or "mathematiques" in nlow, ntext
          print("PERSONA_NORMAL_PUBLIC_PASS")
          print("NORMAL_TEXT="+ntext)

          roast=ask("ROAST")
          rtext=str(roast.get("text","")).strip()
          rlow=rtext.lower()
          assert rtext, roast
          assert "secours local" not in rlow, rtext
          punch=roast.get("punchline") or {}
          assert str(punch.get("text","")).strip(), roast
          reaction=punch.get("reaction") or {}
          assert reaction.get("emojis"), roast
          print("PERSONA_ROAST_PUBLIC_PASS")
          print("ROAST_TEXT="+rtext)
          print("PUNCH="+str(punch.get("text","")))
          print("REACTION="+json.dumps(reaction,ensure_ascii=False))
          PY
