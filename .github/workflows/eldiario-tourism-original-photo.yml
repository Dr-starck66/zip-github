name: ELDIARIO tourism CC documentary image gate
on:
  push:
    branches: [eldiariodelcibao-metadata-integration]
    paths: [".github/workflows/eldiario-tourism-original-photo.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eldiario-tourism-photo
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eldiariodelcibao-metadata-integration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Source-rights photo pipeline with exact original SHA verification
        run: python eldiariodelcibao/scripts/astra_cibao_tourism_cover.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real image binary and SEO attribution proof
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {assessImage} from './eldiariodelcibao/lib/image-seo-rights-guard.mjs';
          const p='/turismo-en-el-cibao/';
          const m=JSON.parse(fs.readFileSync('eldiariodelcibao/data/image-manifest.json','utf8'));
          const asset=m[p];
          assert.equal(assessImage({path:p,title:asset.pageTitle},asset).status,'PASS');
          assert.equal(asset.source.license,'CC BY-SA 3.0');
          assert.equal(asset.source.author,'Fanny S Forsdik');
          assert.ok(asset.caption.includes('2013'));
          const b=fs.readFileSync('eldiariodelcibao/public'+asset.path);
          assert.equal(b.byteLength,asset.bytes);
          assert.equal(b.toString('ascii',0,4),'RIFF');
          assert.equal(b.toString('ascii',8,12),'WEBP');
          assert.equal(createHash('sha256').update(b).digest('hex'),asset.sha256);
          console.log('ASTRA_CIBAO_TOURISM_IMAGE_PASS',asset.path,asset.bytes);
          JS
      - name: Store licensed media and audit evidence
        run: |
          git config user.name "astra-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eldiariodelcibao/data/image-manifest.json eldiariodelcibao/public/images/turismo-cibao-puerto-plata-panoramica-atlantico.webp
          if ! git diff --cached --quiet; then
            git commit -m "media(eldiario): real Puerto Plata CC BY-SA panorama for tourism hub [skip ci]"
            git pull --rebase origin eldiariodelcibao-metadata-integration
            git push origin HEAD:eldiariodelcibao-metadata-integration
          fi
