name: ASTRA Local OS Publisher
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "astra-local-os/publish.trigger"
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: astra-local-os-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate due articles
        run: node astra-local-os/generate.mjs
      - name: Commit changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain astra-local-os)" ]; then
            echo "No publication due."
            exit 0
          fi
          git config user.name "ASTRA Publisher"
          git config user.email "astra-publisher@users.noreply.github.com"
          git add astra-local-os
          git commit -m "ASTRA Local OS: publish scheduled content"
          git push origin main
