name: Evidorix Gateway CI
on:
  push:
    branches: [main]
    paths:
      - "evidorix-gateway/**"
      - ".github/workflows/evidorix-gateway-ci.yml"
  pull_request:
    paths:
      - "evidorix-gateway/**"
jobs:
  evidence-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Core self-test
        run: cd evidorix-gateway && npm test
      - name: Ten-case regression benchmark
        run: cd evidorix-gateway && node benchmark.mjs
