name: ROI Expansion History Collect

on:
  push:
    branches:
      - roi-expansion-eval
    paths:
      - "roi-eval/**"
      - ".github/workflows/roi-expansion-history.yml"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect ESPN history
        run: node roi-eval/collect.mjs
      - name: Upload history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roi-expansion-history
          path: |
            new-leagues.json
            audit.json
          if-no-files-found: error
