name: ASTRA Forum Archive Diagnostic

on:
  push:
    paths:
      - ".github/workflows/astra-forum-archive-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Measure durable archive league coverage
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Dr-starck66/betgpt-railway.git repo
          cd repo
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('data/archive-history.json','utf8'));
          const counts={};
          const range={};
          for(const m of j.matches){
            counts[m.league]=(counts[m.league]||0)+1;
            const d=String(m.kickoff).slice(0,10);
            range[m.league]=range[m.league]||{min:d,max:d};
            if(d<range[m.league].min) range[m.league].min=d;
            if(d>range[m.league].max) range[m.league].max=d;
          }
          console.log('TOTAL',j.matches.length);
          console.log('COUNTS',JSON.stringify(counts));
          console.log('RANGES',JSON.stringify(range));
          NODE
