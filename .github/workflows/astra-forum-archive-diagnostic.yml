name: ASTRA Forum Archive Diagnostic

on:
  push:
    paths:
      - ".github/workflows/astra-forum-archive-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect archive names for production 404 samples
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Dr-starck66/betgpt-railway.git repo
          cd repo
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('data/archive-history.json','utf8'));
          const dates=['2024-04-13','2023-05-06','2026-02-28','2025-03-16','2025-02-16','2025-05-11'];
          for (const d of dates) {
            const rows=j.matches.filter(m=>String(m.kickoff).startsWith(d));
            console.log('DATE',d,'COUNT',rows.length);
            for(const m of rows) {
              const s=((m.homeName||'')+' '+(m.awayName||'')).toLowerCase();
              if(/psv|vitesse|sparta|falkirk|kilmarnock|dundee|rio ave|avs|feyenoord/.test(s)) {
                console.log(JSON.stringify({id:m.id,league:m.league,kickoff:m.kickoff,home:m.homeName,away:m.awayName}));
              }
            }
          }
          NODE
