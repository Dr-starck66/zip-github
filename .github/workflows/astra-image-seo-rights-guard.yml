name: ASTRA IMAGE SEO RIGHTS GUARD Omega
on:
  push:
    branches: [astra-image-seo-rights-guard-omega, main]
    paths:
      - "astra-bricks/image-seo-rights-guard/**"
      - ".github/workflows/astra-image-seo-rights-guard.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reusable rights and SEO quality gates
        run: |
          node --check astra-bricks/image-seo-rights-guard/index.mjs
          node astra-bricks/image-seo-rights-guard/test.mjs
