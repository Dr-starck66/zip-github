name: ELDIARIO continuous Wayback evidence recovery
on:
  schedule:
    - cron: "27 02 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/eldiario-daily-archive-recovery.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eldiario-daily-evidence-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out only the El Diario restoration branch
        uses: actions/checkout@v4
        with:
          ref: eldiariodelcibao-metadata-integration
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free parser
        run: python -m pip install --disable-pip-version-check "beautifulsoup4==4.12.3"
      - name: Incremental evidence retrieval (bounded to 12 archival URLs)
        run: |
          python eldiariodelcibao/scripts/recover-wayback-2018.py --limit 12 --workers 2
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path("eldiariodelcibao/data/wayback-2018-metadata.json")
          data=json.loads(f.read_text(encoding="utf8"))
          records=data.get("records",[])
          assert data["totalJune2018"]==259
          assert len(records)<=259
          assert len({r["path"] for r in records})==len(records)
          assert all(r["path"].startswith("/2018/06/") for r in records)
          assert all(r["indexable"] is False for r in records)
          print("ASTRA_ARCHIVE_EVIDENCE_GATE",json.dumps({
             "attempted":len(records),"verified":sum(r["status"]=="evidence-metadata" for r in records),
             "failed":sum(r["status"]=="fetch-failed" for r in records),
             "remaining":259-len(records),"noindex":True
          }))
          PY
      - name: Save audited metadata only
        run: |
          git config user.name "astra-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eldiariodelcibao/data/wayback-2018-metadata.json
          if ! git diff --cached --quiet; then
            git commit -m "data(eldiario): gradual Wayback source proof and retry ledger [skip ci]"
            git pull --rebase origin eldiariodelcibao-metadata-integration
            git push origin HEAD:eldiariodelcibao-metadata-integration
          fi
