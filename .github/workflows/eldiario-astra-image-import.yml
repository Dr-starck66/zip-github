name: ELDIARIO ASTRA licensed WebP photos
on:
  push:
    branches: [eldiariodelcibao-metadata-integration]
    paths:
      - ".github/workflows/eldiario-astra-image-import.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eldiario-astra-image-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eldiariodelcibao-metadata-integration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free image processor
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Fetch and validate Commons exact licenses and files
        run: python eldiariodelcibao/scripts/astra_image_import.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real manifest gate — license, context, SEO, binary dimensions
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from "node:fs";
          import assert from "node:assert/strict";
          import {assessImage} from "./eldiariodelcibao/lib/image-seo-rights-guard.mjs";
          const m=JSON.parse(readFileSync("eldiariodelcibao/data/image-manifest.json","utf8"));
          assert.equal(Object.keys(m).length>=2,true);
          for(const [path,a] of Object.entries(m)){
            const page={path,title:a.pageTitle};
            const res=assessImage(page,a);
            assert.equal(res.status,"PASS",JSON.stringify({path,res}));
            const b=readFileSync("eldiariodelcibao/public"+a.path);
            assert.equal(b.length,a.bytes);
            assert.equal(b.subarray(0,4).toString("ascii"),"RIFF");
            assert.equal(b.subarray(8,12).toString("ascii"),"WEBP");
            console.log("ASTRA_IMAGE_PASS",path,a.path,a.bytes,res.score);
          }
          JS
      - name: Commit only 2 approved images and provenance manifest
        run: |
          git config user.name "astra-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eldiariodelcibao/public/images/ eldiariodelcibao/data/image-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "media(eldiario): two fact-matched CC BY-SA photographs, SEO WebP and license proof [skip ci]"
            git pull --rebase origin eldiariodelcibao-metadata-integration
            git push origin HEAD:eldiariodelcibao-metadata-integration
          fi
