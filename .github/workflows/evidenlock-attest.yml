name: EVIDENLOCK OIDC Attestation

on:
  push:
    branches: [main]
    paths:
      - "evidenlock-gateway/**"
      - ".github/workflows/evidenlock-attest.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: evidenlock-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run EVIDENLOCK tests
        run: npm test

      - name: Verify live production controls
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl -fsS https://evidenlock-gateway.netlify.app/health)"
          SECURITY="$(curl -fsS 'https://evidenlock-gateway.netlify.app/v1/selftest?phase=security')"
          PERSISTENCE_WRITE="$(curl -fsS 'https://evidenlock-gateway.netlify.app/v1/selftest?phase=write')"
          PERSISTENCE_READ="$(curl -fsS 'https://evidenlock-gateway.netlify.app/v1/selftest?phase=read')"
          node - "$HEALTH" "$SECURITY" "$PERSISTENCE_WRITE" "$PERSISTENCE_READ" <<'NODE'
          const [healthRaw,securityRaw,writeRaw,readRaw]=process.argv.slice(2);
          const health=JSON.parse(healthRaw);
          const security=JSON.parse(securityRaw);
          const write=JSON.parse(writeRaw);
          const read=JSON.parse(readRaw);
          if(!health.ok) throw new Error("health failed");
          if(!security.ok||!security.privateNetworkBlocked||!security.github?.verified) throw new Error("security selftest failed");
          if(!write.nonce||read.record?.nonce!==write.nonce) throw new Error("persistence mismatch");
          console.log("production controls PASS");
          NODE

      - name: Request GitHub OIDC token and attest to EVIDENLOCK
        shell: bash
        env:
          EVIDENLOCK_URL: https://evidenlock-gateway.netlify.app
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=evidenlock")"
          ID_TOKEN="$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.value) process.exit(2); process.stdout.write(x.value)' "$OIDC_JSON")"
          echo "::add-mask::$ID_TOKEN"

          BODY="$(node <<'NODE'
          const body={
            policy:"strict",
            task:"PASS only if the EVIDENLOCK test suite, public health check, Red Team security self-test, durable persistence check and GitHub OIDC identity all succeed.",
            answer:"GitHub Actions tests passed. Red Team production security self-test passed. Independent second-run persistence verification passed. GitHub OIDC identity was supplied for cryptographic verification.",
            evidence:[
              "GitHub Actions test PASS",
              "https://evidenlock-gateway.netlify.app/health HTTP 200",
              "Red Team production security selftest PASS",
              "independent second run persistence selftest PASS",
              "commit SHA "+process.env.GITHUB_SHA,
              "GitHub workflow run "+process.env.GITHUB_RUN_ID
            ].join("\n")
          };
          process.stdout.write(JSON.stringify(body));
          NODE
          )"

          HTTP_CODE="$(curl -sS -o /tmp/evidenlock-response.json -w "%{http_code}" -X POST "${EVIDENLOCK_URL}/v1/github/attest" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$BODY")"
          RESPONSE="$(cat /tmp/evidenlock-response.json)"
          echo "EVIDENLOCK_HTTP_STATUS=$HTTP_CODE"

          node - "$HTTP_CODE" "$RESPONSE" <<'NODE'
          const [httpCode,raw]=process.argv.slice(2);
          let result;
          try { result=JSON.parse(raw); }
          catch { console.error("Non-JSON EVIDENLOCK response:", raw.slice(0,1000)); throw new Error("invalid EVIDENLOCK response"); }
          if(httpCode!=="201") {
            console.error("EVIDENLOCK rejected attestation:",JSON.stringify(result,null,2));
            throw new Error("EVIDENLOCK HTTP "+httpCode);
          }
          if(result.verdict!=="PASS") {
            console.error(JSON.stringify(result,null,2));
            throw new Error("EVIDENLOCK attestation did not PASS");
          }
          if(result.principal?.type!=="github_oidc") throw new Error("OIDC principal missing");
          console.log(JSON.stringify({
            verdict:result.verdict,
            score:result.score,
            auditId:result.id,
            fingerprint:result.fingerprint,
            principal:result.principal
          },null,2));
          NODE
