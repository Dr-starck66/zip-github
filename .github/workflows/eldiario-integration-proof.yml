name: ELDIARIO evidence integration proof
on:
  push:
    branches: [eldiariodelcibao-metadata-integration]
    paths:
      - "eldiariodelcibao/server.mjs"
      - "eldiariodelcibao/data/content.json"
      - "eldiariodelcibao/scripts/astra_local_guide_guard.mjs"
      - "eldiariodelcibao/scripts/recover-wayback-2018.py"
      - ".github/workflows/eldiario-integration-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and local server
        run: |
          python3 -m py_compile eldiariodelcibao/scripts/recover-wayback-2018.py
          node --check eldiariodelcibao/server.mjs
          node eldiariodelcibao/scripts/astra_local_guide_guard.mjs
          cd eldiariodelcibao
          PORT=3087 node server.mjs > /tmp/eldiario.log 2>&1 &
          node - <<'JS'
          const assert=require('node:assert/strict');
          const base='http://127.0.0.1:3087';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
           for(let i=0;i<20;i++){try{const r=await fetch(base+'/health');if(r.ok)break}catch{} await sleep(250)}
           const paths=['/health','/','/archivo/','/archivo/2018/06/','/archive-evidence.json','/sitemap.xml','/news-sitemap.xml','/2018/06/convocan-paro-por-48-horas-en-esperanza.html','/archivo/2018/esperanza-boca-de-mao-obras-protestas/'];
           for(const p of paths){const r=await fetch(base+p);assert.equal(r.status,200,p)}
           const evidence=await(await fetch(base+'/archive-evidence.json')).json();
           assert.equal(evidence.registered,259);
           const fs=require('node:fs');
          const ledger=JSON.parse(fs.readFileSync('data/wayback-2018-metadata.json','utf8'));
          assert.equal(evidence.checked,ledger.records.length);
          assert.equal(evidence.evidence,ledger.records.filter(x=>x.status==='evidence-metadata').length);
          assert.ok(evidence.checked<=259);
           assert.equal(evidence.noindex,true);
           const page=await(await fetch(base+'/2018/06/convocan-paro-por-48-horas-en-esperanza.html')).text();
           assert.ok(page.includes('noindex,follow'));
           const sitemap=await(await fetch(base+'/sitemap.xml')).text();
           assert.ok(!sitemap.includes('/2018/06/convocan-paro-por-48-horas-en-esperanza.html'));
           const essay=await(await fetch(base+'/archivo/2018/esperanza-boca-de-mao-obras-protestas/')).text();
           assert.ok(essay.includes('index,follow,max-image-preview:large'));
           assert.ok(!essay.includes('name="robots" content="noindex'));
           assert.equal((essay.match(/<h1>/g)||[]).length,1);
           assert.ok(essay.includes('application/ld+json'));
           assert.ok((essay.match(/web.archive.org\/web\//g)||[]).length>=4);
           assert.ok(sitemap.includes('/archivo/2018/esperanza-boca-de-mao-obras-protestas/'));
           const text=essay.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
           assert.ok(text.split(' ').length>1500);
           console.log('ASTRA_CIBAO_INTEGRATION_PROOF PASS',paths.length,'endpoints');
          })().catch(err=>{console.error(err);process.exitCode=1})
          JS
