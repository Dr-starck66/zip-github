name: TrustLoom Gateway CI
on:
  push:
    branches: [main]
    paths: ["trustloom-gateway/**",".github/workflows/trustloom-gateway-ci.yml"]
  pull_request:
    paths: ["trustloom-gateway/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: trustloom-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Start gateway and smoke test
        run: |
          node server.mjs > /tmp/trustloom.log 2>&1 &
          PID=$!
          sleep 2
          curl --fail http://127.0.0.1:8787/health
          curl --fail -X POST http://127.0.0.1:8787/v1/audits -H 'content-type: application/json' -d '{"policy":"balanced","task":"PASS if tested","answer":"Red Team executed and result reproduced on second run independent.","evidence":"Playwright test PASS\ncommit SHA abc"}'
          kill $PID
