name: ASTRA Railway Single-Flight · BetGPT

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "betgpt-railway-live/source-manifest.json"
      - "betgpt-railway-live/.astra-green-release.json"
      - ".github/workflows/astra-railway-singleflight-betgpt.yml"

permissions:
  contents: write

concurrency:
  group: astra-railway-singleflight-betgpt
  cancel-in-progress: true

jobs:
  reconcile-approved-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout deployment wrapper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate approved GREEN release proof
        id: approved
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="betgpt-railway-live/source-manifest.json"
          MARKER="betgpt-railway-live/.astra-green-release.json"

          SHA="$(jq -r '.sourceSha // empty' "$MANIFEST")"
          MARKER_SHA="$(jq -r '.sourceSha // empty' "$MARKER")"
          RUN_ID="$(jq -r '.workflowRunId // empty' "$MARKER")"
          GREEN="$(jq -r '.greenVerified // false' "$MARKER")"

          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "ASTRA_SINGLEFLIGHT_BLOCKED_INVALID_MANIFEST"; exit 1; }
          [ "$MARKER_SHA" = "$SHA" ] || { echo "ASTRA_SINGLEFLIGHT_BLOCKED_MARKER_MISMATCH manifest=$SHA marker=$MARKER_SHA"; exit 1; }
          [ "$GREEN" = "true" ] || { echo "ASTRA_SINGLEFLIGHT_BLOCKED_NOT_GREEN $SHA"; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "ASTRA_SINGLEFLIGHT_BLOCKED_INVALID_RUN_ID"; exit 1; }

          RUN_JSON="$(curl -fsSL             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/Dr-starck66/betgpt-railway/actions/runs/$RUN_ID")"

          printf '%s' "$RUN_JSON" | jq -e --arg sha "$SHA" '
            .head_sha == $sha and
            .head_branch == "main" and
            .status == "completed" and
            .conclusion == "success" and
            (.path | endswith("/astra-never-fail.yml"))
          ' >/dev/null

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ASTRA_SINGLEFLIGHT_APPROVED_GREEN sha=$SHA run=$RUN_ID"

      - name: Check whether production already converged
        id: public
        shell: bash
        env:
          TARGET: ${{ steps.approved.outputs.sha }}
        run: |
          set -euo pipefail
          HEALTH="$(curl -fsS -o /dev/null -w '%{http_code}' https://betgpt.live/api/health || true)"
          PUBLIC_SHA="$(curl -fsS --connect-timeout 8 --max-time 20 https://betgpt.live/astra-revision.json 2>/dev/null | jq -r '.sourceSha // empty' 2>/dev/null || true)"
          if [[ "$HEALTH" =~ ^2[0-9][0-9]$ ]] && [ "$PUBLIC_SHA" = "$TARGET" ]; then
            echo "converged=true" >> "$GITHUB_OUTPUT"
            echo "ASTRA_SINGLEFLIGHT_ALREADY_CONVERGED $TARGET"
          else
            echo "converged=false" >> "$GITHUB_OUTPUT"
            echo "ASTRA_SINGLEFLIGHT_NEEDS_REDEPLOY target=$TARGET public=$PUBLIC_SHA health=$HEALTH"
          fi

      - name: Re-emit approved GREEN release once
        if: steps.public.outputs.converged != 'true'
        id: reemit
        shell: bash
        env:
          TARGET: ${{ steps.approved.outputs.sha }}
          RUN_ID: ${{ steps.approved.outputs.run_id }}
        run: |
          set -euo pipefail
          MARKER="betgpt-railway-live/.astra-green-release.json"
          MANIFEST="betgpt-railway-live/source-manifest.json"

          LAST_REEMIT="$(jq -r '.reemit.sourceSha // empty' "$MARKER")"
          if [ "$LAST_REEMIT" = "$TARGET" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ASTRA_SINGLEFLIGHT_REDEPLOY_ALREADY_EMITTED $TARGET"
            exit 0
          fi

          node <<'NODE'
          const fs = require("fs");
          const markerPath = "betgpt-railway-live/.astra-green-release.json";
          const manifestPath = "betgpt-railway-live/source-manifest.json";
          const marker = JSON.parse(fs.readFileSync(markerPath, "utf8"));
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          const now = new Date().toISOString();
          marker.reemit = {
            sourceSha: process.env.TARGET,
            greenWorkflowRunId: Number(process.env.RUN_ID),
            at: now,
            controller: "ASTRA_RAILWAY_GREEN_RECONCILER"
          };
          manifest.updatedAt = now;
          manifest.reason = "Re-emit approved GREEN release because public production had not converged";
          fs.writeFileSync(markerPath, JSON.stringify(marker, null, 2) + "\n");
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
          NODE

          git config user.name "ASTRA Railway Reconciler"
          git config user.email "actions@users.noreply.github.com"
          git add "$MARKER" "$MANIFEST"
          git commit -m "deploy: reemit approved GREEN BetGPT candidate"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Hold until approved SHA is healthy in production
        shell: bash
        env:
          TARGET: ${{ steps.approved.outputs.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            HEALTH="$(curl -fsS -o /dev/null -w '%{http_code}' https://betgpt.live/api/health || true)"
            PUBLIC_SHA="$(curl -fsS --connect-timeout 8 --max-time 20 https://betgpt.live/astra-revision.json 2>/dev/null | jq -r '.sourceSha // empty' 2>/dev/null || true)"
            if [[ "$HEALTH" =~ ^2[0-9][0-9]$ ]] && [ "$PUBLIC_SHA" = "$TARGET" ]; then
              echo "ASTRA_SINGLEFLIGHT_PASS $TARGET"
              exit 0
            fi
            echo "ASTRA_SINGLEFLIGHT_WAIT target=$TARGET public=$PUBLIC_SHA health=$HEALTH attempt=$i"
            sleep 15
          done

          echo "ASTRA_SINGLEFLIGHT_FAIL: approved GREEN SHA never reached healthy production"
          exit 1
