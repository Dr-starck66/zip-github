name: ASTRA Railway Single-Flight · BetGPT

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: astra-railway-singleflight-betgpt
  cancel-in-progress: false

jobs:
  promote-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout deployment wrapper
        uses: actions/checkout@v4

      - name: Resolve immutable BetGPT SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'User-Agent: ASTRA-Railway-SingleFlight/1.0' \
            https://api.github.com/repos/Dr-starck66/betgpt-railway/commits/main | \
            python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved $SHA"

      - name: Coalesce to one manifest promotion
        shell: bash
        run: |
          set -euo pipefail
          node astra-railway-singleflight/promote.mjs \
            betgpt-railway-live/source-manifest.json \
            Dr-starck66/betgpt-railway \
            "${{ steps.source.outputs.sha }}"

      - name: Commit only when SHA changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- betgpt-railway-live/source-manifest.json; then
            echo "ASTRA_SINGLEFLIGHT_NOOP: manifest already points at requested SHA"
            exit 0
          fi
          git config user.name "ASTRA Railway Single-Flight"
          git config user.email "actions@users.noreply.github.com"
          git add betgpt-railway-live/source-manifest.json
          git commit -m "deploy(betgpt): promote ${{ steps.source.outputs.sha }}"
          git push
