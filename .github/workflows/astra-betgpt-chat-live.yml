name: ASTRA BetGPT Chat Live Gate

on:
  push:
    paths:
      - ".github/workflows/astra-betgpt-chat-live.yml"
      - "betgpt-railway-live/.astra-green-release.json"
      - "betgpt-railway-live/source-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout release controller
        uses: actions/checkout@v4

      - name: Probe exact reported phrase immediately
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request

          url="https://betgpt.live/api/chat"
          exact="La France va perdre 25 zero ce soir"

          def ask(mode):
              payload=json.dumps({
                  "messages":[{"role":"user","content":exact,"timestamp":1}],
                  "requestedMode":mode
              }, ensure_ascii=False).encode()
              req=urllib.request.Request(
                  url, data=payload,
                  headers={"content-type":"application/json","user-agent":"ASTRA-PERSONA-DIRECT/1.0"},
                  method="POST"
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  assert r.status == 200, r.status
                  return json.load(r)

          normal=ask("NORMAL")
          ntext=str(normal.get("text","")).strip()
          nlow=ntext.lower()
          print("DIRECT_NORMAL_RESPONSE=", ntext)
          assert ntext, normal
          assert not any(x in nlow for x in ("ukraine","northern ireland","unibet","le desk a déjà bossé","sélection automatique betgpt")), ntext
          assert "25-0" in ntext or "25 zero" in nlow, ntext
          assert any(x in nlow for x in ("scénario extrême","justificatif de domicile","intellectuellement","probabilité")), ntext
          print("DIRECT_NORMAL_PERSONA_PASS")

          roast=ask("ROAST")
          rtext=str(roast.get("text","")).strip()
          rlow=rtext.lower()
          print("DIRECT_ROAST_RESPONSE=", rtext)
          print("DIRECT_ROAST_PUNCH=", str((roast.get("punchline") or {}).get("text","")).strip())
          assert rtext, roast
          assert not any(x in rlow for x in ("ukraine","northern ireland","unibet","le desk a déjà bossé","sélection automatique betgpt")), rtext
          assert any(x in rlow for x in ("magnifique","grille-pain tactique","autopsie statistique","jeu vidéo")), rtext
          assert str((roast.get("punchline") or {}).get("text","")).strip(), roast
          print("DIRECT_ROAST_PERSONA_PASS")
          PY

      - name: Wait for repaired public revision
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import json; print(json.load(open("betgpt-railway-live/.astra-green-release.json",encoding="utf-8"))["sourceSha"])')"
          echo "expected=$expected"
          for i in $(seq 1 48); do
            body="$(curl -fsS --connect-timeout 6 --max-time 10 https://betgpt.live/astra-revision.json || true)"
            got="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sourceSha",""))' 2>/dev/null || true)"
            echo "revision attempt=$i got=$got"
            if [ "$got" = "$expected" ]; then
              echo "CHAT_REVISION_PASS $got"
              exit 0
            fi
            sleep 5
          done
          echo "CHAT_REVISION_FAIL expected=$expected" >&2
          exit 1

      - name: Probe real chat behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request

          URL="https://betgpt.live/api/chat"

          def ask(text, mode="NORMAL", timeout=35):
              payload=json.dumps({
                  "messages":[{"role":"user","content":text,"timestamp":1}],
                  "requestedMode":mode
              }, ensure_ascii=False).encode()
              req=urllib.request.Request(
                  URL,
                  data=payload,
                  headers={"content-type":"application/json","user-agent":"ASTRA-BetGPT-Chat-Live-Gate/1.0"},
                  method="POST"
              )
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  assert r.status == 200, r.status
                  return json.load(r)

          exact="La France va perdre 25 zero ce soir"

          normal=ask(exact,"NORMAL",12)
          ntext=str(normal.get("text","")).strip()
          nlow=ntext.lower()
          assert ntext, normal
          assert "secours local" not in nlow, ntext
          assert "moteur conversationnel" not in nlow, ntext
          assert "ukraine" not in nlow and "northern ireland" not in nlow and "unibet" not in nlow, ntext
          assert "le desk a déjà bossé" not in nlow and "sélection automatique betgpt" not in nlow, ntext
          assert "25-0" in ntext, ntext
          assert any(x in nlow for x in ("justificatif de domicile","intellectuellement paresseux","scénario extrême")), ntext
          print("BETGPT_EXACT_NORMAL_RESPONSE", ntext)
          print("ASTRA_PERSONALITY_NORMAL_LIVE_PASS")

          roast=ask(exact,"ROAST",12)
          rtext=str(roast.get("text","")).strip()
          rlow=rtext.lower()
          assert rtext, roast
          assert "ukraine" not in rlow and "northern ireland" not in rlow and "unibet" not in rlow, rtext
          assert "le desk a déjà bossé" not in rlow and "sélection automatique betgpt" not in rlow, rtext
          assert any(x in rlow for x in ("magnifique","grille-pain tactique","autopsie statistique")), rtext
          assert roast.get("punchline",{}).get("text","").strip(), roast
          print("BETGPT_EXACT_ROAST_RESPONSE", rtext)
          print("BETGPT_EXACT_PUNCH", roast["punchline"]["text"])
          print("ASTRA_PERSONALITY_ROAST_LIVE_PASS")

          tactical=ask("Pourquoi un 4-4-2 peut souffrir face à un 3-2-5 ?","NORMAL",35)
          ttext=str(tactical.get("text","")).strip()
          tlow=ttext.lower()
          assert ttext, tactical
          assert "secours local" not in tlow, ttext
          assert "moteur conversationnel" not in tlow, ttext
          assert not tlow.startswith("je te suis."), ttext
          assert any(x in tlow for x in ("milieu","largeur","ligne","surnombre","piston","demi-espace","bloc","pressing")), ttext
          print("CHAT_REAL_AI_PASS", ttext)
          PY

# ASTRA personality verification nonce: 2026-10-02T17:39Z
