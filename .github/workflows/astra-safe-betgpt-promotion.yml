name: ASTRA Safe BetGPT Promotion

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "betgpt-railway-live/.astra-promotion-request"
      - ".github/workflows/astra-safe-betgpt-promotion.yml"

concurrency:
  group: astra-safe-betgpt-promotion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote-latest-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout promotion controller
        uses: actions/checkout@v4

      - name: Resolve latest GREEN BetGPT release-train candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/Dr-starck66/betgpt-railway"
          HDR=(-H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          RUNS_JSON="$(curl -fsSL "${HDR[@]}" "$API/actions/workflows/astra-never-fail.yml/runs?branch=main&status=success&per_page=1")"
          HEAD_JSON="$(curl -fsSL "${HDR[@]}" "$API/commits/main")"

          SHA="$(printf '%s' "$RUNS_JSON" | jq -r '.workflow_runs[0].head_sha // empty')"
          RUN_ID="$(printf '%s' "$RUNS_JSON" | jq -r '.workflow_runs[0].id // empty')"
          SOURCE_HEAD="$(printf '%s' "$HEAD_JSON" | jq -r '.sha // empty')"
          CURRENT="$(jq -r '.sourceSha // empty' betgpt-railway-live/source-manifest.json)"
          MARKER="$(jq -r '.sourceSha // empty' betgpt-railway-live/.astra-green-release.json)"
          PUBLIC_SHA="$(curl -fsS --connect-timeout 8 --max-time 20 https://betgpt.live/astra-revision.json 2>/dev/null | jq -r '.sourceSha // empty' 2>/dev/null || true)"

          for value in "$SHA" "$SOURCE_HEAD"; do
            [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Invalid candidate/head proof." >&2; exit 1; }
          done
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid workflow proof." >&2; exit 1; }

          # Release Train invariant 1: the candidate must still belong to the
          # current main lineage. Newer unverified commits may exist ahead of it.
          COMPARE_JSON="$(curl -fsSL "${HDR[@]}" "$API/compare/$SHA...$SOURCE_HEAD")"
          COMPARE_STATUS="$(printf '%s' "$COMPARE_JSON" | jq -r '.status // empty')"
          MERGE_BASE="$(printf '%s' "$COMPARE_JSON" | jq -r '.merge_base_commit.sha // empty')"
          if [ "$MERGE_BASE" != "$SHA" ] || { [ "$COMPARE_STATUS" != "ahead" ] && [ "$COMPARE_STATUS" != "identical" ]; }; then
            echo "ASTRA_RELEASE_TRAIN_BLOCKED_NON_ANCESTOR candidate=$SHA sourceHead=$SOURCE_HEAD status=$COMPARE_STATUS base=$MERGE_BASE"
            echo "promote=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Release Train invariant 2: never roll production backwards.
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$SHA" ]; then
            CURRENT_COMPARE="$(curl -fsSL "${HDR[@]}" "$API/compare/$CURRENT...$SHA")"
            CURRENT_STATUS="$(printf '%s' "$CURRENT_COMPARE" | jq -r '.status // empty')"
            CURRENT_BASE="$(printf '%s' "$CURRENT_COMPARE" | jq -r '.merge_base_commit.sha // empty')"
            if [ "$CURRENT_BASE" != "$CURRENT" ] || { [ "$CURRENT_STATUS" != "ahead" ] && [ "$CURRENT_STATUS" != "identical" ]; }; then
              echo "ASTRA_RELEASE_TRAIN_NO_ROLLBACK current=$CURRENT candidate=$SHA status=$CURRENT_STATUS base=$CURRENT_BASE"
              echo "promote=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ "$CURRENT" = "$SHA" ] && [ "$MARKER" = "$SHA" ] && [ "$PUBLIC_SHA" = "$SHA" ]; then
            echo "Production already serves latest GREEN release-train candidate $SHA"
            echo "promote=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CURRENT" = "$SHA" ] && [ "$PUBLIC_SHA" != "$SHA" ]; then
            echo "ASTRA_RELEASE_TRAIN_REEMIT_REQUIRED manifest=$SHA public=$PUBLIC_SHA"
          fi

          echo "ASTRA_RELEASE_TRAIN_READY candidate=$SHA sourceHead=$SOURCE_HEAD current=$CURRENT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_head=$SOURCE_HEAD" >> "$GITHUB_OUTPUT"
          echo "promote=true" >> "$GITHUB_OUTPUT"

      - name: Reverify GREEN workflow proof and source lineage
        if: steps.candidate.outputs.promote == 'true'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          WORKFLOW_RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/Dr-starck66/betgpt-railway"
          HDR=(-H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          RUN_JSON="$(curl -fsSL "${HDR[@]}" "$API/actions/runs/$WORKFLOW_RUN_ID")"
          printf '%s' "$RUN_JSON" | jq -e --arg sha "$CANDIDATE_SHA" '
            .head_sha == $sha and
            .head_branch == "main" and
            .status == "completed" and
            .conclusion == "success" and
            (.path | endswith("/astra-never-fail.yml"))
          ' >/dev/null

          SOURCE_HEAD="$(curl -fsSL "${HDR[@]}" "$API/commits/main" | jq -r '.sha // empty')"
          COMPARE_JSON="$(curl -fsSL "${HDR[@]}" "$API/compare/$CANDIDATE_SHA...$SOURCE_HEAD")"
          STATUS="$(printf '%s' "$COMPARE_JSON" | jq -r '.status // empty')"
          BASE="$(printf '%s' "$COMPARE_JSON" | jq -r '.merge_base_commit.sha // empty')"
          if [ "$BASE" != "$CANDIDATE_SHA" ] || { [ "$STATUS" != "ahead" ] && [ "$STATUS" != "identical" ]; }; then
            echo "ASTRA_RELEASE_TRAIN_BLOCKED_LINEAGE_CHANGED candidate=$CANDIDATE_SHA sourceHead=$SOURCE_HEAD status=$STATUS base=$BASE"
            exit 78
          fi

      - name: Promote immutable GREEN release-train candidate
        if: steps.candidate.outputs.promote == 'true'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          WORKFLOW_RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          set -euo pipefail

          assert_lineage() {
            local api="https://api.github.com/repos/Dr-starck66/betgpt-railway"
            local head compare status base
            head="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$api/commits/main" | jq -r '.sha // empty')"
            compare="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$api/compare/$CANDIDATE_SHA...$head")"
            status="$(printf '%s' "$compare" | jq -r '.status // empty')"
            base="$(printf '%s' "$compare" | jq -r '.merge_base_commit.sha // empty')"
            if [ "$base" != "$CANDIDATE_SHA" ] || { [ "$status" != "ahead" ] && [ "$status" != "identical" ]; }; then
              echo "ASTRA_RELEASE_TRAIN_BLOCKED_LINEAGE_CHANGED candidate=$CANDIDATE_SHA sourceHead=$head status=$status base=$base"
              exit 78
            fi
            printf '%s' "$head"
          }

          SOURCE_HEAD_AT_PROMOTION="$(assert_lineage)"
          export SOURCE_HEAD_AT_PROMOTION

          node <<'NODE'
          const fs = require("fs");
          const sha = process.env.CANDIDATE_SHA;
          const runId = Number(process.env.WORKFLOW_RUN_ID);
          const sourceHead = process.env.SOURCE_HEAD_AT_PROMOTION;
          const manifestPath = "betgpt-railway-live/source-manifest.json";
          const markerPath = "betgpt-railway-live/.astra-green-release.json";

          const m = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          m.schema = "astra-railway-singleflight/v1";
          m.sourceRepo = "Dr-starck66/betgpt-railway";
          m.sourceSha = sha;
          m.promotionKey = `Dr-starck66/betgpt-railway@${sha}`;
          m.policy = {
            ...(m.policy || {}),
            immutableShaOnly: true,
            envSourceOverrides: false,
            oneManifestChangePerPromotion: true,
            greenCandidateOnly: true,
            currentHeadOnly: false,
            greenAncestorOfHeadOnly: true,
            monotonicPromotionOnly: true,
            releaseTrain: true,
            doubleLineageCheck: true,
            promotionController: "ASTRA_SAFE_BETGPT_PROMOTION"
          };
          m.updatedAt = new Date().toISOString();
          m.reason = "Release Train: promote latest immutable GREEN ancestor of current main without rollback starvation";

          const marker = {
            schema: "astra-green-release/v2",
            sourceRepo: "Dr-starck66/betgpt-railway",
            sourceSha: sha,
            sourceHeadAtPromotion: sourceHead,
            promotionKey: `Dr-starck66/betgpt-railway@${sha}`,
            greenVerified: true,
            lineageVerified: true,
            monotonicVerified: true,
            releaseTrain: true,
            controller: "ASTRA_SAFE_BETGPT_PROMOTION",
            gateWorkflow: "astra-never-fail.yml",
            workflowRunId: runId,
            verifiedAt: new Date().toISOString()
          };

          fs.writeFileSync(manifestPath, JSON.stringify(m, null, 2) + "\n");
          fs.writeFileSync(markerPath, JSON.stringify(marker, null, 2) + "\n");
          NODE

          git config user.name "ASTRA Safe Promotion"
          git config user.email "actions@users.noreply.github.com"
          git add betgpt-railway-live/source-manifest.json betgpt-railway-live/.astra-green-release.json
          git diff --cached --quiet && exit 0
          git commit -m "deploy: release-train latest GREEN BetGPT candidate"

          git pull --rebase origin main
          assert_lineage >/dev/null
          git push
