name: ASTRA Safe BetGPT Promotion

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: astra-safe-betgpt-promotion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote-latest-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout promotion controller
        uses: actions/checkout@v4

      - name: Resolve latest GREEN BetGPT candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/Dr-starck66/betgpt-railway/actions/workflows/astra-never-fail.yml/runs?branch=main&status=success&per_page=1"
          JSON="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API")"
          SHA="$(printf '%s' "$JSON" | jq -r '.workflow_runs[0].head_sha // empty')"
          if [ -z "$SHA" ]; then
            echo "No GREEN candidate available; production remains unchanged."
            echo "promote=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid candidate SHA: $SHA" >&2
            exit 1
          fi
          CURRENT="$(jq -r '.sourceSha // empty' betgpt-railway-live/source-manifest.json)"
          if [ "$CURRENT" = "$SHA" ]; then
            echo "Production already points to latest GREEN candidate $SHA"
            echo "promote=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "promote=true" >> "$GITHUB_OUTPUT"

      - name: Verify candidate workflow conclusion again
        if: steps.candidate.outputs.promote == 'true'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/Dr-starck66/betgpt-railway/actions/workflows/astra-never-fail.yml/runs?branch=main&status=success&per_page=20"
          JSON="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API")"
          COUNT="$(printf '%s' "$JSON" | jq --arg sha "$CANDIDATE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')"
          test "$COUNT" -ge 1

      - name: Promote immutable GREEN SHA
        if: steps.candidate.outputs.promote == 'true'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const p = "betgpt-railway-live/source-manifest.json";
          const m = JSON.parse(fs.readFileSync(p, "utf8"));
          const sha = process.env.CANDIDATE_SHA;
          m.schema = "astra-railway-singleflight/v1";
          m.sourceRepo = "Dr-starck66/betgpt-railway";
          m.sourceSha = sha;
          m.promotionKey = `Dr-starck66/betgpt-railway@${sha}`;
          m.policy = {
            ...(m.policy || {}),
            immutableShaOnly: true,
            envSourceOverrides: false,
            oneManifestChangePerPromotion: true,
            greenCandidateOnly: true,
            promotionController: "ASTRA_SAFE_BETGPT_PROMOTION"
          };
          m.updatedAt = new Date().toISOString();
          m.reason = "Automatic promotion of latest GREEN ASTRA Never-Fail candidate";
          fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
          NODE

          git config user.name "ASTRA Safe Promotion"
          git config user.email "actions@users.noreply.github.com"
          git add betgpt-railway-live/source-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "deploy: promote latest GREEN BetGPT candidate [skip ci]"
          git push
