name: ASTRA MASTER GATE Omega
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  astra-master-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies when a lockfile exists
        run: if test -f package-lock.json; then npm ci --ignore-scripts; fi
      - name: Run ASTRA core regression tests
        run: node --test scripts/astra-master-gate.test.mjs
      - name: Detect unverified or missing ASTRA brick proof
        run: node scripts/astra-master-gate.mjs --task=code --strict
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-master-shared-site-report
          path: artifacts/astra-master-gate/report.json
          if-no-files-found: error
