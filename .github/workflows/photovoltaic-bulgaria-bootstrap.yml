name: Bootstrap Photovoltaic Bulgaria
on:
  push:
    branches: [main]
    paths:
      - 'photovoltaic-bulgaria-import.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download prepared site and source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://duality-x-v02.floot.app/_cdn/static/80f09a02-447d-4a61-82b5-799778e434de-photovoltaic-bulgaria-built.zip' -o /tmp/pb-built.zip
          curl -L --fail --retry 3 'https://duality-x-v02.floot.app/_cdn/static/24e834e1-ec63-421a-b7c1-8af4926cbf59-photovoltaic-bulgaria-site.zip' -o /tmp/pb-source.zip
      - name: Extract without touching existing sites
        run: |
          set -euo pipefail
          rm -rf photovoltaic-bulgaria photovoltaic-bulgaria-src /tmp/pb-source
          mkdir -p photovoltaic-bulgaria photovoltaic-bulgaria-src /tmp/pb-source
          unzip -q /tmp/pb-built.zip -d photovoltaic-bulgaria
          unzip -q /tmp/pb-source.zip -d /tmp/pb-source
          cp -a /tmp/pb-source/photovoltaic-bulgaria/. photovoltaic-bulgaria-src/
      - name: Make GitHub Pages preview subpath-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          base='/zip-github/photovoltaic-bulgaria'
          for p in Path('photovoltaic-bulgaria').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=s.replace('href="/', f'href="{base}/').replace('src="/', f'src="{base}/')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit imported project
        run: |
          set -euo pipefail
          git config user.name 'Photovoltaic Bulgaria Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add photovoltaic-bulgaria photovoltaic-bulgaria-src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'site: import Photovoltaic Bulgaria source and public build'
          git push
