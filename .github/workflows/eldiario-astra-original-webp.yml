name: ELDIARIO ASTRA original image WebP gate
on:
  push:
    branches: [eldiariodelcibao-metadata-integration]
    paths:
      - ".github/workflows/eldiario-astra-original-webp.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eldiariodelcibao-metadata-integration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - run: python eldiariodelcibao/scripts/astra_original_cover.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provenance, SEO, WebP, and editorial subject test
        run: |
          node --input-type=module - <<'JS'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          import {assessImage} from "./eldiariodelcibao/lib/image-seo-rights-guard.mjs";
          const m=JSON.parse(fs.readFileSync("./eldiariodelcibao/data/image-manifest.json","utf8"));
          const path="/archivo/2018/esperanza-boca-de-mao-obras-protestas/";
          const a=m[path];
          const b=fs.readFileSync("./eldiariodelcibao/public"+a.path);
          assert.equal(assessImage({path,title:a.pageTitle},a).status,"PASS");
          assert.equal(b.length,a.bytes);
          assert.equal(b.subarray(0,4).toString("ascii"),"RIFF");
          assert.equal(b.subarray(8,12).toString("ascii"),"WEBP");
          console.log("ASTRA_ORIGINAL_IMAGE_PASS",a.path,a.bytes);
          JS
      - name: Commit only new original asset and evidence register
        run: |
          git config user.name "astra-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eldiariodelcibao/public/images/esperanza-boca-mao-obras-protestas-2018.webp eldiariodelcibao/data/image-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "media(eldiario): original WebP image and provenance proof [skip ci]"
            git pull --rebase origin eldiariodelcibao-metadata-integration
            git push origin HEAD:eldiariodelcibao-metadata-integration
          fi
