name: ASTRA Lumistade Public Image Proof Ω
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/astra-lumistade-public-image-proof.yml
      - scripts/astra-lumistade-public-proof.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require five live pages, ten distinct large JPEGs, sitemap, exact release SHA
        run: python scripts/astra-lumistade-public-proof.py
