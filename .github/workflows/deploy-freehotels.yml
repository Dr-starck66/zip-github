name: Deploy FreeHotels V3 to Netlify
on:
  push:
    branches: [freehotels-deploy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
      - name: Rebuild static bundle
        run: |
          rm -rf site-src site.zip
          mkdir -p site-src
          base64 -d freehotels-site.zip.b64 > site.zip
          unzip -q site.zip -d site-src
          test -f site-src/index.html
          test -f site-src/news/index.html
          test -f site-src/sitemap-news.xml
          test -f site-src/feed.xml
      - name: Deploy to existing Netlify site
        working-directory: site-src
        run: >
          npx -y @netlify/mcp@latest
          --site-id 0d941ca4-e9b1-49cd-b90e-4b96994362fa
