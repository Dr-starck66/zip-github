name: ASTRA SAFE BetGPT promotion auth proof
on:
  pull_request:
    paths:
      - '.github/workflows/astra-safe-betgpt-promotion.yml'
      - '.github/workflows/astra-safe-promotion-auth-proof.yml'
      - 'scripts/safe-betgpt-promotion-auth.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-safe-betgpt-promotion.yml'
      - '.github/workflows/astra-safe-promotion-auth-proof.yml'
      - 'scripts/safe-betgpt-promotion-auth.test.mjs'
permissions:
  contents: read
jobs:
  auth-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Prove actual API token coverage and release security invariants
        run: node --test scripts/safe-betgpt-promotion-auth.test.mjs
