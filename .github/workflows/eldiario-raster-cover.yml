name: ELDIARIO archival cover PNG proof
on:
  push:
    branches: [eldiariodelcibao-metadata-integration]
    paths: [".github/workflows/eldiario-raster-cover.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rasterize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eldiariodelcibao-metadata-integration
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render SVG and validate PNG dimensions
        run: |
          python -m pip install --disable-pip-version-check "cairosvg==2.7.1"
          (cd eldiariodelcibao && PORT=3098 node server.mjs > /tmp/cibao-serve.log 2>&1 &)
          python - <<'PY'
          import time, struct, urllib.request
          from pathlib import Path
          import cairosvg
          link="http://127.0.0.1:3098/media/archivo-valverde-2018.svg"
          svg=None
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(link,timeout=3) as response:
                      svg=response.read()
                  break
              except Exception:
                  time.sleep(.3)
          if svg is None: raise RuntimeError("Cannot obtain the editorial source SVG")
          dest=Path("eldiariodelcibao/public/media/archivo-valverde-2018.png")
          dest.parent.mkdir(parents=True,exist_ok=True)
          cairosvg.svg2png(bytestring=svg,write_to=str(dest),output_width=1200,output_height=675)
          data=dest.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          width,height=struct.unpack(">II",data[16:24])
          assert (width,height)==(1200,675),(width,height)
          assert len(data)>15000,len(data)
          print("ELDIARIO_RASTER_PROOF",{"width":width,"height":height,"size":len(data),"source":"original editorial illustration; not historical photography"})
          PY
      - name: Commit only generated image
        run: |
          git config user.name "astra-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eldiariodelcibao/public/media/archivo-valverde-2018.png
          if ! git diff --cached --quiet; then
            git commit -m "media(eldiario): verified 1200x675 historical cover PNG [skip ci]"
            git push origin HEAD:eldiariodelcibao-metadata-integration
          fi
