name: ASTRA BetGPT Route Latency Proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/astra-betgpt-route-proof.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable SHA and bound public-route latency
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(jq -r '.sourceSha' betgpt-railway-live/source-manifest.json)"
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]
          CANONICAL="https://betgpt-production-7353.up.railway.app"
          REVISION="$(curl -fsSL --connect-timeout 8 --max-time 20 "$CANONICAL/astra-revision.json")"
          ACTUAL="$(printf '%s' "$REVISION" | jq -r '.sourceSha // empty')"
          test "$ACTUAL" = "$TARGET"
          echo "ASTRA_RELEASE_SHA_PASS target=$TARGET"
          for i in 1 2; do
            for path in /api/health /actualites /equipe/angola /equipe/scotland /equipe/hertha-berlin; do
              result="$(curl -sSL --connect-timeout 8 --max-time 16 -o /dev/null -w '%{http_code} %{time_total}' "$CANONICAL$path")"
              read -r code seconds <<< "$result"
              case "$path" in
                /equipe/*) test "$code" = 200 || test "$code" = 404 ;;
                *) test "$code" = 200 ;;
              esac
              python3 - "$seconds" <<'PY'
          import sys
          assert float(sys.argv[1]) < 15, f"Route took too long: {sys.argv[1]} s"
          PY
              echo "ASTRA_ROUTE_PASS iteration=$i path=$path http=$code time=$seconds"
            done
          done
          PUBLIC_REV="$(curl -fsSL --connect-timeout 8 --max-time 20 https://betgpt.live/astra-revision.json)"
          test "$(printf '%s' "$PUBLIC_REV" | jq -r '.sourceSha // empty')" = "$TARGET"
          echo "ASTRA_PUBLIC_ALIAS_SHA_PASS target=$TARGET"
