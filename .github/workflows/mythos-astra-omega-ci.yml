name: Mythos Astra Omega CI
on:
  push:
    branches: [main]
    paths:
      - "mythos-astra-omega/**"
      - ".github/workflows/mythos-astra-omega-ci.yml"
  pull_request:
    paths:
      - "mythos-astra-omega/**"
jobs:
  reliability-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Mythos Astra Omega self-test
        run: node mythos-astra-omega/selftest.cjs
