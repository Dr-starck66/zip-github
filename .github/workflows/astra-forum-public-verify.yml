name: ASTRA Forum Public Verify Ω

on:
  push:
    branches: [main]
    paths:
      - "betgpt-railway-live/.astra-forum-verify-request"

permissions:
  contents: read

jobs:
  verify-forum:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public football agent network
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(jq -r '.target // empty' betgpt-railway-live/.astra-forum-verify-request)"
          [[ "$TARGET" =~ ^[0-9a-fA-F]{40}$ ]]

          REV="$(curl -fsS --connect-timeout 8 --max-time 20 -H 'cache-control: no-cache' https://betgpt.live/astra-revision.json)"
          PUBLIC_SHA="$(printf '%s' "$REV" | jq -r '.sourceSha // empty')"
          test "$PUBLIC_SHA" = "$TARGET"
          echo "PUBLIC_REVISION_PASS=$PUBLIC_SHA"

          URL="https://betgpt.live/forum/cyprus-armenia-2026-10-02"
          T="$(curl --compressed -fsSL --connect-timeout 8 --max-time 15 -H 'cache-control: no-cache' -o /tmp/forum.html -w '%{time_total}' "$URL")"
          python3 - "$T" <<'PY'
          import sys
          t=float(sys.argv[1])
          assert t < 8.0, f"forum too slow: {t}s"
          print(f"PUBLIC_FORUM_TIME_PASS={t:.3f}s")
          PY

          POSTS="$(grep -ao 'aria-label="Réactions des agents"' /tmp/forum.html | wc -l | tr -d ' ')"
          test "$POSTS" -ge 30
          grep -aF "Le fil des IA" /tmp/forum.html >/dev/null
          grep -aF "répond à" /tmp/forum.html >/dev/null
          grep -aF "chambrage" /tmp/forum.html >/dev/null
          if grep -aFqi "noindex" /tmp/forum.html; then
            echo "PUBLIC_FORUM_INDEXABILITY_FAIL"
            exit 1
          fi
          echo "PUBLIC_FORUM_SSR_PASS posts=$POSTS indexable=yes"

          QWEN=0
          for i in $(seq 1 18); do
            sleep 5
            curl --compressed -fsSL --connect-timeout 8 --max-time 15 -H 'cache-control: no-cache' "$URL" -o /tmp/forum-qwen.html || true
            if grep -aF "Qwen local" /tmp/forum-qwen.html >/dev/null 2>&1; then
              QWEN=1
              echo "PUBLIC_FORUM_QWEN_PASS attempt=$i"
              break
            fi
          done
          test "$QWEN" = "1"

          POSTS2="$(grep -ao 'aria-label="Réactions des agents"' /tmp/forum-qwen.html | wc -l | tr -d ' ')"
          test "$POSTS2" -ge "$POSTS"
          echo "PUBLIC_FORUM_FINAL_PASS posts=$POSTS2 qwen_local=yes"
