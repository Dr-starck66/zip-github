<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img"><rect width="1200" height="600" fill="#11192b"/><rect x="55" y="55" width="1090" height="490" rx="28" fill="#182746" stroke="#5bd2ee" stroke-width="3"/><text x="95" y="160" fill="#fff" font-family="Arial" font-size="48">From detection to verified remediation</text><rect x="85" y="255" width="148" height="128" rx="15" fill="#246883"/><text x="98" y="322" fill="#fff" font-family="Arial" font-size="22">Inventory</text><text x="238" y="326" fill="#a3ddff" font-family="Arial" font-size="28">→</text><rect x="259" y="255" width="148" height="128" rx="15" fill="#2f5873"/><text x="272" y="322" fill="#fff" font-family="Arial" font-size="22">Match CVE</text><text x="412" y="326" fill="#a3ddff" font-family="Arial" font-size="28">→</text><rect x="433" y="255" width="148" height="128" rx="15" fill="#246883"/><text x="446" y="322" fill="#fff" font-family="Arial" font-size="22">KEV/EPSS</text><text x="586" y="326" fill="#a3ddff" font-family="Arial" font-size="28">→</text><rect x="607" y="255" width="148" height="128" rx="15" fill="#2f5873"/><text x="620" y="322" fill="#fff" font-family="Arial" font-size="22">Exposure</text><text x="760" y="326" fill="#a3ddff" font-family="Arial" font-size="28">→</text><rect x="781" y="255" width="148" height="128" rx="15" fill="#246883"/><text x="794" y="322" fill="#fff" font-family="Arial" font-size="22">Patch</text><text x="934" y="326" fill="#a3ddff" font-family="Arial" font-size="28">→</text><rect x="955" y="255" width="148" height="128" rx="15" fill="#2f5873"/><text x="968" y="322" fill="#fff" font-family="Arial" font-size="22">Retest</text><text x="95" y="480" fill="#b7dcff" font-size="27" font-family="Arial">Never mark PASS before a production retest.</text></svg>