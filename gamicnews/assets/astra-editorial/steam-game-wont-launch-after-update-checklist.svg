<text x="89" y="772" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#aed1e0">No random DLL downloads • No save deletion • No simultaneous changes</text>
<text x="90" y="854" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#9eecdf">ORIGINAL EXPLANATORY ARTWORK  •  GAMIC NEWS  •  1600 × 900</text>
